    about_title: "UpNow란?"
    about_description: "UpNow는 일정 간격으로 일어나서 운동하도록 유도하는 macOS 메뉴바 앱입니다. 오래 앉아있는 습관을 개선하고 건강한 업무 환경을 만들어드립니다."
    features_title: "주요 기능"
    feature_interval: "맞춤형 알림 간격 설정 (30분~120분)"
    feature_video: "YouTube 운동 영상과 함께하는 스트레칭"
