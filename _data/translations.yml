  upnow_support:
    title: "UpNow Support"
    subtitle: "Need help with the UpNow app?"
    description: "If you have questions or encounter issues while using the app, you can get help through the methods below."
    about_title: "What is UpNow?"
    about_description: "UpNow is a macOS menu bar app that reminds you to get up and exercise at regular intervals. It helps improve your sedentary habits and creates a healthier work environment."
    features_title: "Key Features"
    feature_interval: "Customizable reminder intervals (30-120 minutes)"
    feature_video: "Stretching with YouTube workout videos"
    feature_monitor: "Multi-monitor support"
    feature_camera: "Camera presence detection (auto-pause when away)"
    feature_lock: "Screen lock for guaranteed breaks"
    faq_title: "Frequently Asked Questions"
    faq_q1: "How long is the free trial?"
    faq_a1: "You can use all features free for 30 days from the first app launch."
    faq_q2: "How do I unlock the screen lock?"
    faq_a2: "It automatically unlocks when the workout time ends. In emergencies, press the ESC key or click the \"Unlock\" button on screen."
    faq_q3: "I can't see the menu bar icon"
    faq_a3: "The icon may be hidden if your macOS menu bar space is limited. Try reducing other app icons in the menu bar, or use an app like Bartender."
    faq_q4: "Can I receive notifications only during specific hours?"
    faq_a4: "Yes, you can set \"Active Hours\" in settings. For example, you can configure it to only send notifications from 9 AM to 6 PM."
    faq_q5: "How do I restore my purchase?"
    faq_a5: "Click the \"Restore Purchase\" button at the bottom of the settings screen to restore your previous purchase."
