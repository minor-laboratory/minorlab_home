    faq_q2: "데이터는 어떻게 백업하나요?"
    faq_a2: "로그인 시 자동으로 클라우드에 백업됩니다. 프리미엄 구독 시 무제한 클라우드 동기화를 사용할 수 있습니다."
    faq_q3: "프리미엄 기능은 무엇인가요?"
    faq_a3: "무제한 클라우드 동기화, 고급 독서 통계, 데이터 내보내기, 프리미엄 테마, 광고 제거 등의 기능을 사용할 수 있습니다."
    faq_q4: "계정을 삭제하려면 어떻게 하나요?"
    faq_a4: "앱 내 더보기 탭 > 프로필 > 회원 탈퇴 메뉴에서 삭제할 수 있습니다."
    contact_title: "문의하기"
