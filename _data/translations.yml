    feature_lock: "화면 잠금으로 확실한 휴식 유도"
    faq_title: "자주 묻는 질문"
    faq_q1: "무료 체험 기간은 얼마인가요?"
    faq_a1: "앱 첫 실행일로부터 30일간 모든 기능을 무료로 사용할 수 있습니다."
    faq_q2: "화면 잠금은 어떻게 해제하나요?"
    faq_a2: "운동 시간이 끝나면 자동으로 해제됩니다. 긴급 상황에는 ESC 키 또는 화면의 \"해제\" 버튼을 눌러 즉시 해제할 수 있습니다."
    faq_q3: "메뉴바 아이콘이 보이지 않아요"
    faq_a3: "macOS 메뉴바 공간이 부족하면 아이콘이 숨겨질 수 있습니다. 메뉴바의 다른 앱 아이콘을 줄이거나, Bartender 같은 앱을 사용해보세요."
    faq_q4: "특정 시간대에만 알림을 받을 수 있나요?"
    faq_a4: "네, 설정에서 \"실행 시간대\"를 지정할 수 있습니다. 예를 들어 오전 9시~오후 6시에만 알림을 받도록 설정할 수 있습니다."
    faq_q5: "구매 복원은 어떻게 하나요?"
    faq_a5: "설정 화면 하단의 \"구매 복원\" 버튼을 클릭하면 이전 구매 내역이 복원됩니다."
    contact_title: "문의하기"
    contact_description: "앱 사용 중 문제가 있거나 도움이 필요하시면 이메일로 문의해주세요."
