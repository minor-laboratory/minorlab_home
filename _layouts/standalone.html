<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'ko' }}">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {%- if page.title -%}
      {{ page.title }} | {{ site.title }}
    {%- else -%}
      {{ site.title }}
    {%- endif -%}
  </title>

  <meta name="description" content="{{ page.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
  <link rel="icon" type="image/x-icon" href="{{ '/assets/images/favicon.ico' | relative_url }}">

  <!-- Styles -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

  <!-- External scripts (loaded in head with defer) -->
  {%- if page.external_scripts -%}
    {%- for script in page.external_scripts -%}
      <script src="{{ script }}" defer></script>
    {%- endfor -%}
  {%- endif -%}
</head>
<body>
  <!-- Standalone: No header, no footer, no navigation -->
  <main aria-label="Content">
    {{ content }}
  </main>

  <!-- Page-specific scripts -->
  {%- if page.page_scripts -%}
    {%- for script in page.page_scripts -%}
      <script>{{ script }}</script>
    {%- endfor -%}
  {%- endif -%}
</body>
</html>
